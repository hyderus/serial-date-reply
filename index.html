<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serial Date Reply</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glow-indigo {
      box-shadow: 0 0 40px -5px rgba(99, 102, 241, 0.25);
    }
    .glow-emerald {
      box-shadow: 0 0 35px -5px rgba(16, 185, 129, 0.35);
    }
    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .pulse-subtle {
      animation: pulse-subtle 0.25s ease-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white flex items-center justify-center p-4 sm:p-6">

  <!-- Background decorative glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px]"></div>
    <div class="absolute top-1/2 -right-32 w-96 h-96 bg-emerald-600/15 rounded-full blur-[130px]"></div>
    <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-sky-600/15 rounded-full blur-[120px]"></div>
  </div>

  <!-- Main Card -->
  <main class="w-full max-w-xl glass-card rounded-3xl p-6 sm:p-10 glow-indigo shadow-2xl transition-all space-y-6">

    <!-- Header -->
    <div class="text-center">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
        Serial Date <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-sky-300 to-emerald-400">Reply</span>
      </h1>
    </div>

    <!-- Input Section -->
    <div class="space-y-2">
      <div class="flex justify-between items-center">
        <label for="serialInput" class="block text-xs font-bold uppercase tracking-wider text-slate-400">
          Enter Serial Number
        </label>
        <span class="text-xs text-slate-500 font-mono" id="charCount">0 chars</span>
      </div>

      <div class="relative">
        <input
          type="text"
          id="serialInput"
          placeholder="e.g. 29271FDH300H2F"
          autocomplete="off"
          autofocus
          class="w-full bg-slate-900/95 border-2 border-slate-700/80 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 rounded-2xl px-5 py-4 text-xl sm:text-2xl font-mono text-white placeholder-slate-600 tracking-wider uppercase transition-all shadow-inner outline-none"
        />
        <button
          id="clearBtn"
          onclick="clearInput()"
          class="hidden absolute right-4 top-1/2 -translate-y-1/2 px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white text-xs font-semibold hover:bg-slate-700 transition-colors"
        >
          Clear
        </button>
      </div>
    </div>

    <!-- Error Message -->
    <div id="errorMessage" class="hidden p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs sm:text-sm flex items-center gap-2.5">
      <svg class="w-4 h-4 flex-shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      <span id="errorText">Please enter at least 4 characters.</span>
    </div>

    <!-- Output Box: Numbers Only -->
    <div id="resultBox" class="p-6 sm:p-8 rounded-2xl bg-gradient-to-br from-slate-900/90 to-slate-950 border border-emerald-500/30 glow-emerald transition-all text-center space-y-4">
      
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Reply
        </span>
        <span id="offsetBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/15 border border-indigo-500/30 text-indigo-300 font-mono">
          +1 day
        </span>
      </div>

      <!-- Large Numbers Display -->
      <div id="replyDisplay" class="text-5xl sm:text-6xl font-black font-mono tracking-widest text-emerald-300 select-all py-2">
        ----
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-center gap-3 pt-2">
        <button
          id="copyBtn"
          onclick="copyReply()"
          class="flex-1 inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm transition-all shadow-lg shadow-emerald-500/25 active:scale-95 cursor-pointer"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          <span id="copyBtnText">Copy</span>
        </button>

        <button
          onclick="recalculate(true)"
          title="Roll again (1=40%, 2/3/4=20% each)"
          class="px-5 py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm transition-all border border-slate-700 flex items-center gap-2 active:scale-95 cursor-pointer"
        >
          <span>🎲</span>
          <span>Roll</span>
        </button>
      </div>

    </div>

  </main>

  <script>
    let currentResult = null;

    const serialInput = document.getElementById('serialInput');
    const charCount = document.getElementById('charCount');
    const clearBtn = document.getElementById('clearBtn');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const replyDisplay = document.getElementById('replyDisplay');
    const offsetBadge = document.getElementById('offsetBadge');
    const copyBtnText = document.getElementById('copyBtnText');

    // Randomize: 1 (40%), 2 (20%), 3 (20%), 4 (20%)
    function pickRandomDays() {
      const r = Math.random();
      if (r < 0.40) return 1;       // 40% of the time
      if (r < 0.60) return 2;       // 20%
      if (r < 0.80) return 3;       // 20%
      return 4;                     // 20%
    }

    // Core Calculation: Output numbers only
    function computeReply(input) {
      const clean = input.replace(/\s+/g, '').toUpperCase();
      if (clean.length < 4) {
        return { error: 'Please enter at least 4 characters.' };
      }

      const yChar = clean[0];
      const mChar = clean[1];
      const ddStr = clean.slice(2, 4);

      // Year = 2020 + Y
      const yVal = parseInt(yChar, 10);
      if (isNaN(yVal)) {
        return { error: `Invalid Year character '${yChar}'.` };
      }
      const origYear = 2020 + yVal;

      // Month: Decimal equivalent of M (1-9, A=10, B=11, C=12)
      const origMonth = parseInt(mChar, 16);
      if (isNaN(origMonth) || origMonth < 1 || origMonth > 12) {
        return { error: `Invalid Month character '${mChar}'.` };
      }

      // Day = DD
      const origDay = parseInt(ddStr, 10);
      if (isNaN(origDay) || origDay < 1 || origDay > 31) {
        return { error: `Invalid Day '${ddStr}'.` };
      }

      // Pick random offset (1 is 40%, others 20% each)
      const offset = pickRandomDays();

      // Standard date addition using UTC
      const date = new Date(Date.UTC(origYear, origMonth - 1, origDay));
      date.setUTCDate(date.getUTCDate() + offset);

      const newYear = date.getUTCFullYear();
      const newMonth = date.getUTCMonth() + 1; // 1-12
      const newDay = date.getUTCDate();

      // Convert back strictly to numbers:
      // 1st digit = Last digit of the new year
      const d1 = String(newYear % 10);

      // 2nd digit = Month as a number (1-9, and 10->0, 11->1, 12->2) so output is purely numbers
      const d2 = String(newMonth % 10);

      // 3rd & 4th digits = New day (01-31)
      const d34 = String(newDay).padStart(2, '0');

      const numericReply = `${d1}${d2}${d34}`;

      return {
        reply: numericReply,
        offset: offset
      };
    }

    function handleInput() {
      const val = serialInput.value;
      charCount.textContent = `${val.length} char${val.length === 1 ? '' : 's'}`;
      clearBtn.classList.toggle('hidden', val.length === 0);

      if (val.trim().length === 0) {
        errorMessage.classList.add('hidden');
        replyDisplay.textContent = '----';
        offsetBadge.textContent = '+0 days';
        currentResult = null;
        return;
      }

      recalculate(false);
    }

    function recalculate(animate) {
      const val = serialInput.value;
      if (!val || val.trim().length === 0) return;

      const res = computeReply(val);

      if (res.error) {
        errorMessage.classList.remove('hidden');
        errorText.textContent = res.error;
        replyDisplay.textContent = '----';
        currentResult = null;
        return;
      }

      errorMessage.classList.add('hidden');
      currentResult = res;

      replyDisplay.textContent = res.reply;
      offsetBadge.textContent = `+${res.offset} day${res.offset === 1 ? '' : 's'}`;

      if (animate) {
        replyDisplay.classList.remove('pulse-subtle');
        void replyDisplay.offsetWidth;
        replyDisplay.classList.add('pulse-subtle');
      }
    }

    function clearInput() {
      serialInput.value = '';
      serialInput.focus();
      handleInput();
    }

    function copyReply() {
      if (!currentResult || !currentResult.reply) return;
      navigator.clipboard.writeText(currentResult.reply).then(() => {
        copyBtnText.textContent = 'Copied!';
        setTimeout(() => {
          copyBtnText.textContent = 'Copy';
        }, 1500);
      });
    }

    serialInput.addEventListener('input', handleInput);
    serialInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        recalculate(true);
      }
    });

    // Initialize with sample from screenshot
    serialInput.value = '29271FDH300H2F';
    handleInput();
  </script>
</body>
</html>
